# Docker Compose lets you define and start multiple containers together.
# We need two: Zookeeper (Kafka's coordinator) and Kafka itself.

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      # The port Zookeeper listens on internally (inside the container network)
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # Keep it running quietly in the background
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    # Kafka must start after Zookeeper is ready
    depends_on:
      - zookeeper
    ports:
      # Map container port 9092 → your WSL host port 9092.
      # This is how your Python code (running outside Docker) talks to Kafka.
      - "9092:9092"
    environment:
      # Tell Kafka where Zookeeper is (inside the Docker network, by service name)
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Two listeners:
      #   PLAINTEXT       → for other containers talking to Kafka (internal)
      #   PLAINTEXT_HOST  → for code on your WSL host talking to Kafka (external)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # 1 broker, so replication factor must be 1 (can't replicate to more
      # brokers than you have)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
